<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div align="center">
        <table border="1" cellpadding="5">
            <h1>data</h1>
            <thead>
                <tr>
                    <td>no</td>
                    <td>name</td>
                    <td>phone</td>
                </tr>
            </thead>
            <tbody id="user"></tbody>
        </table>
    </div>
</body>
<script type="text/javascript">
    const getuser = async () => {
        try {
            let res = await fetch(`http://localhost:9000/users`, {
                headers: {
                    'Content-Type': `application/json`
                }
            })
            let data = await res.json();
            let users = data.users
            if (data.success) {

                let tbl = "";
                users.map((val, i) => {
                    tbl += `
                         <tr>
                            <td>${val.id}</td>
                            <td>${val.name}</td>
                            <td>${val.phone}</td>
                         </tr>
                         
                    `
                })
                document.getElementById('user').innerHTML = tbl
            }

        } catch (err) {
            console.log(err)
            return false;
        }
    }
    getuser()
</script>

</html>
